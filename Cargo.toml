[package]
name = "biohack"
version = "0.1.0"
edition = "2024"
description = "A CLI tool for biohackers to track supplements, medications, vitals, and safety protocols"
license = "MIT OR Apache-2.0"
repository = "https://github.com/s-k-y-h-i-g-h/biohack"
readme = "README.md"
keywords = ["biohacking", "health", "tracking", "cli", "quantified-self"]
categories = ["command-line-utilities", "health"]

[dependencies]
# CLI parsing
clap = { version = "4.6", features = ["derive", "env", "wrap_help", "help"] }
clap_complete = "4.5"

# Database
sled = "0.34"
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Tables & formatting
comfy-table = "7.0"
owo-colors = "4.0"

# Time & dates
chrono = { version = "0.4", features = ["serde"] }

# Utilities
anyhow = "1.0"
directories = "5.0"
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

# Logging (optional, for debug)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for USDA FoodData Central API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.8"
predicates = "3.0"
assert_cmd = "2.0"
proptest = "1.0"

[[bin]]
name = "biohack"
path = "src/main.rs"

[lib]
name = "biohack"
path = "src/lib.rs"